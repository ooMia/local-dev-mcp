[project]
name = "local-dev-mcp"
version = "0.1.0"
description = "Workspace-scoped MCP tools for ChatGPT development sessions"
readme = "README.md"
authors = [
    { name = "Hyeon-hak Kim", email = "hyeonhak.kim.dev@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastmcp==4.1.1",
    "mcp>=2.3.0",
    "pathspec==1.1.1",
    "procrastinate>=3.10.0",
    "psycopg-pool>=3.3.3",
    "pydantic>=2.12.0,<3",
    "python-dotenv>=1.2.4",
    "shellous>=0.42.0",
]

[project.scripts]
local-dev-mcp = "local_dev_mcp.app.cli:main"
local-dev-mcp-gpg = "local_dev_mcp.tools.gpg._wrapper:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.pyright]
include = ["src", "tests", "conftest.py"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -p no:randomly -n auto --maxprocesses=4 -m 'not packaging and not e2e'"
markers = [
    "unit: data and callable processing without real OS resources",
    "integration: real filesystem, process, framework or installed-package contracts",
    "dag: integration nodes with explicit prerequisites and bounded concurrent execution",
    "e2e: actual ChatGPT-mediated user workflow; never a local MCP substitute",
    "packaging: opt-in wheel installation and entry-point integration",
]

[tool.coverage.run]
branch = true
source = ["local_dev_mcp"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/local_dev_mcp"]
only_mutate = ["*/tools/workspace/_text.py"]
also_copy = ["conftest.py"]
pytest_add_cli_args = ["-o", "addopts=-q -p no:randomly", "-m", "unit"]
pytest_add_cli_args_test_selection = ["tests/tools/workspace/test_text.py"]

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0,<4",
    "pytest-randomly==5.0.0",
    "ruff>=0.17.1",
]
mutation = ["mutmut==3.8.0"]
