# B3-S local PostgreSQL dependency only. Application/worker remain separate.
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: b3s_dev
      POSTGRES_DB: b3s_dev
      POSTGRES_PASSWORD: ${B3S_DB_PASSWORD:?Set B3S_DB_PASSWORD in infra/postgres/.env}
    ports:
      - "127.0.0.1:${B3S_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b3s_dev -d b3s_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
