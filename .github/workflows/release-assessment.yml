name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    name: Project quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check formatting
        run: uv run --locked ruff format --check --quiet src tests conftest.py
      - name: Lint
        run: uv run --locked ruff check --quiet --output-format concise src tests conftest.py
      - name: Check types
        run: uv run --locked pyright
      - name: Run unit tests only
        run: uv run --locked pytest --verbosity=-1 --tb=short --no-header -rfE -n 0 -m unit tests
      - name: Verify Git fixture isolation against hostile global signing
        run: >-
          uv run --locked pytest --verbosity=-1 --tb=short --no-header -rfE
          -n 0 -m integration
          tests/quality/test_quality_cli.py
          tests/tools/test_workflow_pr_git.py
          tests/tools/git/test_worktrunk_cli.py::test_worktrunk_squash_and_safe_removal
