name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    name: Project quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run registered nonmutating quality checks
        run: uv run --locked python -m local_dev_mcp.tools.workflow check
      - name: Validate exact PR release snapshots
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked python -m local_dev_mcp.tools.release check --base "$RELEASE_BASE" --head "$RELEASE_HEAD"
      - name: Build and inspect wheel and source distribution
        run: uv run --locked python -m local_dev_mcp.tools.workflow package
