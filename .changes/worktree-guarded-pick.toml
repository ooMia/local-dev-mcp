migration = "Restart the LOCAL_DEV_MCP server to expose get_project_worktree_pick_state, cherry_pick_project_worktree_commit and commit_project_worktree_pick. Existing tools and permissions stay unchanged; writes require git, wt and git.worktree.write logical permissions."
