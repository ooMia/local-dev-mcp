impact = "minor"
summary = "Support guarded cherry-pick and reviewed signed commits in Git-registered Worktrunk checkouts while preserving dirty controller files."
reason = "The existing cherry-pick and commit tools operated on the controller checkout only, blocking safe migration from already merged source histories into a clean remote-main-based linked worktree. Three additive MCP tools reuse existing protected-path, index fingerprint, identity and signing controls without allowing caller-selected paths or arbitrary Git commands."
